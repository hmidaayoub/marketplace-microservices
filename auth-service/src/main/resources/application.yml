server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_auth_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

internal:
  api:
    key: ${INTERNAL_API_KEY:dev-internal-api-key-change-in-production}

jwt:
  secret: ${JWT_SECRET:change-me-in-production-min-256-bits-long-secret-key}
  expiry-minutes: ${JWT_EXPIRY:60}
  refresh-expiry-days: ${JWT_REFRESH_EXPIRY:7}

logging:
  level:
    com.marketplace.auth: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

admin:
  bootstrap:
    enabled: true
    email: ${ADMIN_EMAIL:admin@marketplace.local}
    phone: ${ADMIN_PHONE:+10000000000}
    password: ${ADMIN_PASSWORD:}

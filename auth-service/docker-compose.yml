version: "3.9"

services:
  auth-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: user_auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: .
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - DB_HOST=auth-db
      - DB_PORT=5432
      - DB_NAME=user_auth_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - JWT_SECRET=dev-secret-key-change-in-production-min-256-bits
      - INTERNAL_API_KEY=dev-internal-api-key-change-in-production
      - JWT_EXPIRY=60
    depends_on:
      auth-db:
        condition: service_healthy

volumes:
  auth_db_data:

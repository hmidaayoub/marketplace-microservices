# Every test this repo has, on every push.
#
# The platform is five toolchains - Maven, two Go modules, two Python modules and a Vite
# frontend - and each one already knows how to check itself. This runs them, in parallel,
# so that "394 tests pass" is a fact about the branch rather than about the last machine
# somebody remembered to run them on.
name: CI

# Every branch, not only main. Feature branches are merged locally here rather than
# through pull requests, so a pull_request trigger would never fire - and the run worth
# having is the one that happens before the merge, not after it.
on:
  push:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer stale. Only the newest
# commit's verdict means anything, so the older run is cancelled rather than paid for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# It reads code and runs tests. Nothing here publishes, comments or deploys.
permissions:
  contents: read

jobs:
  frontend:
    name: frontend (eslint + unit + component + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the local toolchain rather than tracking "latest", so a Node release
          # cannot turn a green branch red on its own.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: it installs exactly what the lockfile pins and fails when the
      # lockfile and package.json have drifted apart - which is the one thing a build
      # machine must never paper over.
      - run: npm ci

      # Through the script, so CI runs the same command a developer does. It is `tsc -b`
      # and not `tsc --noEmit`: the root tsconfig is solution-style with project
      # references, so --noEmit resolves no files, checks nothing and passes in silence.
      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      # Two suites rather than one `vitest run`, because a red run should name which
      # kind of thing broke without anyone opening the log. They split on the file
      # extension - *.test.ts is logic, *.test.tsx is a component - so a test cannot
      # land in the wrong one without changing the language it is written in.
      #
      # The logic suite: reducers, selectors, the API client and the refresh handler.
      # No React and no rendering, so a failure here is a failure of the app's rules
      # rather than of its markup.
      - name: Unit tests
        run: npm run test:unit

      # The component suite: mounted with Testing Library and asserted through what a
      # user can see. It is the layer between the units above and the e2e flows in the
      # stack job - it catches the guard that redirects to the wrong place without
      # paying for eight containers and a browser download to find out.
      - name: Component tests
        run: npm run test:component

      # Last, because it is the slowest and the least specific: `tsc -b && vite build`
      # re-runs the typecheck above and then produces the bundle the frontend image
      # ships. What it adds over the steps before it is that the thing actually
      # assembles - a bad import path or a missing asset fails here and nowhere else.
      - name: Build
        run: npm run build

  go:
    # One run per module, named so a failure says which. They are separate Go modules
    # outside the Maven reactor, and nothing but HTTP passes between them.
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # A failure in one module is not a reason to withhold the other's verdict.
      fail-fast: false
      matrix:
        module: [request-service, admin-service]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Read from the module rather than pinned here: the version already lives in
          # go.mod, and two places to bump is one place to forget.
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - run: go build ./...

      - run: go vet ./...

      # -count=1 turns off the test cache. A restored cache can report PASS for a package
      # whose inputs have not changed without running it, and these suites stand up a real
      # PostgreSQL through Testcontainers - the runner's own Docker daemon - so "it ran" is
      # worth the ten seconds.
      #
      # -race because both suites deliberately fire concurrent requests at the real unique
      # index, and a data race in that code passes this command every time without it. The
      # detector costs +0.3s in request-service and +2s in admin-service: the suites are
      # dominated by container startup, not by the work it slows down. CGO_ENABLED is left
      # alone - it defaults to 1 on the runner, which -race needs, and the Dockerfiles that
      # ship the binaries set their own 0.
      - name: Test
        run: go test ./... -count=1 -race

  python:
    name: python (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [offer-service, notification-service]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      # No setup-python: uv brings its own interpreter, and the version it must be lives
      # in each module's requires-python already.
      # Pinned to an exact tag, unlike the other four actions here. setup-uv stopped
      # publishing a floating major alias after v7 - there is no `v10` ref, only
      # v10.0.1 - so a major-only pin does not resolve and the job dies before its
      # first step.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.module }}/uv.lock

      # --locked is uv's `npm ci`: install exactly the lockfile, and fail if pyproject.toml
      # has drifted from it rather than quietly resolving something new.
      - name: Install
        run: uv sync --all-groups --locked

      # Before the linters, deliberately. A job stops at its first failing step, so the
      # order decides what a red run tells you: an unsorted import must never hide whether
      # the platform still works. The other way round costs nothing.
      - name: Test
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

  java:
    # One job rather than a matrix: the four Maven modules are one reactor, and three of
    # them compile against common-security, so building them apart would prove less than
    # building them together.
    name: java (maven reactor)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # The version the root pom declares in <java.version>.
          java-version: 21
          cache: maven

      # No MAVEN_OPTS here on purpose. The heap caps that keep the reactor from being
      # OOM-killed beside a Testcontainers PostgreSQL live in .mvn/jvm.config and in the
      # surefire configuration, so they travel with the repository and this runner gets
      # exactly what a developer's machine gets. Setting them here would be a second
      # answer to the same question.
      - name: Test
        run: mvn -B -ntp test

  # The four jobs above ask whether the code works. None of them asks whether what it
  # depends on, or what it ships inside, is something you would want facing the
  # internet - and that question has a different answer every week, because it moves
  # when a CVE is published rather than when somebody commits. A branch that changed
  # nothing can be less safe than it was yesterday, which is why this runs on every
  # push and not only on the pushes that touch a manifest.
  #
  # Two tools with one job each, deliberately not overlapping. Trivy reads what is
  # actually installed - dependency manifests here, and the eight built images over in
  # the stack job. Checkov reads policy: Dockerfile and workflow rules. Where both have
  # an opinion, which is secret detection, only one of them is asked; .checkov.yaml is
  # where that choice is written down and argued.
  security:
    name: security (trivy + checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Only for the SARIF upload. That is what puts a finding on the Security tab
      # against a file and a line, rather than leaving it in a job log that gets read
      # once and only when it is already red. The repository is public, so code
      # scanning needs no Advanced Security licence.
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # The binary rather than aquasecurity/trivy-action, for two reasons. The baseline
      # in .trivyignore.yaml was taken against exactly this version, and the four
      # invocations below then share one downloaded vulnerability database instead of
      # each step fetching its own.
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.74.0
          trivy --version

      # --ignore-unfixed is the difference between a gate and a nuisance. A CVE with no
      # released fix is not something this branch can act on, and reporting it as a
      # build failure means the only way back to green is to stop believing the tool.
      # What is left is the set of findings a version bump would close today.
      #
      # HIGH and CRITICAL only, for the same reason: there are several hundred MEDIUM
      # and LOW across the five toolchains, and a gate nobody can clear is a gate that
      # gets deleted in a month.
      #
      # Secrets are scanned here and not by Checkov. Both can do it; on this repository
      # Trivy reports zero and Checkov reports nine, all of them the documented dev
      # values in docker-compose.yml and the Spring test resources. Two scanners means
      # permanently suppressing one of them, so the accurate one keeps the job.
      - name: Trivy - dependencies and secrets
        run: |
          mkdir -p sarif
          trivy fs \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile .trivyignore.yaml \
            --skip-dirs frontend/node_modules \
            --format sarif --output sarif/trivy-deps.sarif \
            --exit-code 1 \
            .

      # !cancelled() rather than nothing, on this and the steps below: a job stops at
      # its first failing step, and three security tools that only report while the
      # ones before them pass would take three red runs to tell you what one could.
      # The job still fails - every one of these still carries its own --exit-code.
      #
      # HIGH here too, which lets DS-0026 - five images carrying no HEALTHCHECK of
      # their own - report at LOW without gating. Those five are health-checked in
      # docker-compose.yml instead, and the images ship no curl or wget to do it with.
      - name: Trivy - Dockerfile misconfiguration
        if: '!cancelled()'
        run: |
          trivy fs \
            --scanners misconfig \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore.yaml \
            --skip-dirs frontend/node_modules \
            --format sarif --output sarif/trivy-config.sarif \
            --exit-code 1 \
            .

      # Pinned exactly, like setup-uv above and Trivy beside it. Checkov ships new
      # policies continuously - a floating version means a rule published on Tuesday
      # fails a branch that Monday's commit already passed, which is a fine property
      # for a security report and a poor one for a build gate.
      - name: Install Checkov
        if: '!cancelled()'
        run: pipx install checkov==3.3.16

      # Everything it checks and everything it is told not to lives in .checkov.yaml,
      # so this command is the same one a developer runs. It has no severity filter
      # without a Prisma API key, which is why that file's skip list is the whole of
      # the policy rather than a footnote to it.
      - name: Checkov - Dockerfile and workflow policy
        if: '!cancelled()'
        run: checkov --config-file .checkov.yaml -o cli -o sarif --output-file-path console,sarif/checkov.sarif

      # A directory, so all three reports upload in one call. if: !cancelled() because
      # the run worth uploading is the failing one - a report that only publishes when
      # there is nothing to report is not a report.
      - name: Publish findings to the Security tab
        if: '!cancelled()'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif

  # The four jobs above test the five toolchains apart. None of them builds an image,
  # starts a service, or sends a request through the gateway - so the whole layer the
  # platform actually ships as (eight Dockerfiles, one compose network, an nginx config
  # holding the nine public routes) had no verdict at all. A change that breaks a build
  # arg, a service name or a route passes them green and fails on the first `up`.
  #
  # This job is the one that assembles the thing and uses it.
  stack:
    name: stack (compose + smoke + e2e + image scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # As in the security job: only to publish the image findings below.
      security-events: write
    # Eight images from cold, then two browser flows. The unit jobs answer in under two
    # minutes; this one is allowed to take its time because it is answering a different
    # question.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --wait holds until every healthcheck in the compose file reports healthy, and
      # fails the step if one never does. The alternative - sleep, then curl - either
      # wastes time or reports a flake as a failure, and the healthchecks that would
      # make it right already exist.
      - name: Build and start the platform
        id: build
        run: docker compose up --build -d --wait

      # The end-to-end walk of the spec's interaction flows: two customers pool demand,
      # a seller offers against the total, contacts are refused, an admin approves, and
      # only then does a phone number come back. It also asserts the gateway boundary -
      # that /internal and /actuator have no public route - which is the one property no
      # unit test can check, because it is a fact about the topology and not about code.
      - name: Smoke the platform through the gateway
        run: ./scripts/smoke.sh

      # Only chromium, and only here: the unit frontend job never opens a browser, so
      # paying for the download in both would buy nothing.
      - name: Install the browser the e2e flows drive
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # APP_URL, because the e2e scripts default to the Vite dev server on :5173 and
      # what CI must check is the built image behind the gateway instead. These exist
      # because "account creation did not work" was diagnosed three times from the
      # outside while the API and the store both passed - they are the only checks that
      # see what the user sees.
      - name: E2E - a visitor with no account
        working-directory: frontend
        env:
          APP_URL: http://localhost:8080
          API_URL: http://localhost:8080
        run: npm run e2e:public

      - name: E2E - signup through to a request
        working-directory: frontend
        env:
          APP_URL: http://localhost:8080
        run: npm run e2e

      # The eight images the steps above just built and then proved actually work,
      # scanned before the teardown deletes them.
      #
      # Here rather than in the security job because that job would have to build all
      # eight again to see them, and after the smoke and e2e steps rather than before
      # for the reason the python job gives for its own step order: a job stops at its
      # first failing step, and an unpatched libssl must never hide whether the
      # platform still works.
      #
      # CRITICAL, where the manifest scan a job above gates at HIGH. The difference is
      # what a commit can actually do: a dependency is a version this repository picks,
      # while most of what is left in a built image belongs to its base. A freshly
      # pulled nginx:1.27-alpine carries 35 HIGH with fixes released and none of them
      # reachable from a Dockerfile, so gating HIGH here would be gating on something
      # no change to this repository could clear. They are still scanned, still printed
      # and still uploaded - they are just not the build's verdict.
      - name: Install Trivy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.74.0

      # Not simply !cancelled(): a failed smoke or e2e run leaves eight built images
      # that are still worth scanning, but a failed `up --build` leaves nothing to
      # scan, and `trivy image` on a name compose never created would report the
      # build's failure a second time in a less useful sentence.
      - name: Trivy - the eight images this job built
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p sarif
          rc=0
          for svc in frontend auth-service customer-service seller-service \
                     request-service offer-service admin-service notification-service; do
            # Compose names an untagged build <project>-<service>, and the project name
            # comes from the checkout directory. Asking compose is one fewer thing that
            # breaks the day this repository is cloned under a different name.
            img=$(docker compose images --format json "$svc" | jq -r '.[0].Repository + ":" + .[0].Tag')
            echo "::group::$svc ($img)"

            # Reported at HIGH, so the Security tab holds the whole picture...
            trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --ignorefile .trivyignore.yaml \
              --format sarif --output "sarif/trivy-image-$svc.sarif" \
              --exit-code 0 "$img"

            # ...and gated at CRITICAL, which is the part that stops the build. The
            # table is the readable half: without it a red run says only "exit 1".
            trivy image --scanners vuln --severity CRITICAL --ignore-unfixed \
              --ignorefile .trivyignore.yaml \
              --exit-code 1 --quiet "$img" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: Publish image findings to the Security tab
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif
          category: images

      # A red run here means a container is wrong, and the container logs are the only
      # place that says how. Without this the failure reads as "curl got 502" and the
      # reason stays inside a machine that is about to be destroyed.
      - name: Container state and logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200

      # The e2e helpers screenshot the page at the step that failed. That image is worth
      # more than the stack trace above it, so it leaves the runner.
      - name: Failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-screenshots
          path: frontend/e2e/failure-*.png
          if-no-files-found: ignore

      # -v because the seven database volumes are the run's state: leaving them would
      # make a rerun start from a machine that is no longer clean.
      - name: Tear down
        if: always()
        run: docker compose down -v

server:
  port: ${PORT:8083}

spring:
  application:
    name: seller-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seller_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}

jwt:
  secret: ${JWT_SECRET:change-me-in-production-min-256-bits-long-secret-key}

internal:
  api:
    key: ${INTERNAL_API_KEY:dev-internal-api-key-change-in-production}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# Only the public surface is documented. /internal is service-to-service and has no
# route through the gateway, so publishing it in a spec would advertise an API that
# nothing outside the cluster can call.
springdoc:
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**
  swagger-ui:
    enabled: false

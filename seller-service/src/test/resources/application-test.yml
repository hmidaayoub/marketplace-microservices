spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

auth:
  service:
    url: http://localhost:${wiremock.server.port}

jwt:
  secret: test-secret-key-for-unit-tests-only-256-bits-long

internal:
  api:
    key: test-internal-api-key

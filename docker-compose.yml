# Runs the whole system on one network. Services reach each other by service
# name, so no host.docker.internal is needed.
#
#   docker compose up --build
#
# JWT_SECRET and INTERNAL_API_KEY are shared by every service by construction:
# tokens are validated locally in each service, and the internal key is one
# shared secret. Dev values only.

x-secrets: &secrets
  JWT_SECRET: dev-secret-key-change-in-production-min-256-bits
  INTERNAL_API_KEY: dev-internal-api-key-change-in-production
  RABBITMQ_URL: amqp://marketplace:marketplace@rabbitmq:5672/

x-db-healthcheck: &db-healthcheck
  test: ["CMD-SHELL", "pg_isready -U postgres"]
  interval: 5s
  timeout: 5s
  retries: 10

services:
  # The public edge, and the only port this platform publishes. Spec section 19's nine
  # routes live in one file - infrastructure/docker/gateway/nginx.conf - and spec
  # section 6's "/internal must not be exposed by the public API Gateway" is enforced by
  # that file being default-deny, rather than by every service happening to keep its own
  # port private.
  #
  # The service ports below are deliberately unpublished. That is the whole point: the
  # boundary here is the same one an Ingress enforces in Kubernetes, so it is not a rule
  # that only holds in production while local development runs wide open. To reach a
  # service directly - the /internal and /actuator requests in the Postman collection
  # need to - add the opt-in override:
  #
  #   docker compose -f docker-compose.yml -f docker-compose.direct.yml up
  # The aggregated API documentation: one page, a dropdown over all seven specs. Each
  # service generates its own from its own code - springdoc for the Java three, `swag
  # init` for the Go two, FastAPI's own for the Python two - so nothing here is a second
  # description that can fall out of step with a handler.
  #
  # Reached only through the gateway at /docs, so Try it out calls the API on the same
  # origin the page came from and needs no CORS exemption of its own.
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      BASE_URL: /docs
      # The dropdown. Names, not ports: which container answers is the gateway's
      # business, and these paths keep working when it stops being a container at all.
      URLS: >-
        [{"name":"auth-service","url":"/openapi/auth.json"},
         {"name":"customer-service","url":"/openapi/customer.json"},
         {"name":"seller-service","url":"/openapi/seller.json"},
         {"name":"request-service","url":"/openapi/request.json"},
         {"name":"offer-service","url":"/openapi/offer.json"},
         {"name":"admin-service","url":"/openapi/admin.json"},
         {"name":"notification-service","url":"/openapi/notification.json"}]
      URLS_PRIMARY_NAME: auth-service
      # Persist the pasted token across the dropdown, so one login covers every spec.
      PERSIST_AUTHORIZATION: "true"
    healthcheck:
      # BASE_URL is /docs, so / is a 404 even when the container is perfectly well -
      # the probe has to ask for the page the gateway actually proxies.
      #
      # 127.0.0.1, not localhost: inside the container localhost resolves to ::1 first
      # and this nginx listens on IPv4 only, exactly as the gateway does.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/docs"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  gateway:
    image: nginx:1.27-alpine
    ports: ["8080:8080"]
    volumes:
      - ./infrastructure/docker/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-service: {condition: service_healthy}
      customer-service: {condition: service_healthy}
      seller-service: {condition: service_healthy}
      request-service: {condition: service_healthy}
      admin-service: {condition: service_healthy}
      # These two declare their healthcheck in their Dockerfile rather than here, but it
      # is a healthcheck all the same - and the edge routes API traffic to them, so
      # coming up before they can serve it would just turn a slow start into a 502.
      offer-service: {condition: service_healthy}
      notification-service: {condition: service_healthy}
      # Started, not healthy: the docs are not on the path of a single API request, and
      # holding the whole edge closed until a documentation UI is ready gets that
      # backwards.
      swagger-ui: {condition: service_started}
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost resolves to ::1 first
      # and nginx listens on IPv4 only, so the probe would be refused by a healthy edge.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  # Notification events travel over AMQP rather than a direct HTTP call, so a producer
  # never waits on notification-service and a notification is not lost when it is down.
  # The topology itself is declared by the services, not here.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: marketplace
      RABBITMQ_DEFAULT_PASS: marketplace
    ports: ["5672:5672", "15672:15672"]
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  auth-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: user_auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [auth_db_data:/var/lib/postgresql/data]
    healthcheck: *db-healthcheck

  customer-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes: [customer_db_data:/var/lib/postgresql/data]
    healthcheck: *db-healthcheck

  seller-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: seller_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5434:5432"]
    volumes: [seller_db_data:/var/lib/postgresql/data]
    healthcheck: *db-healthcheck

  request-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: request_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5435:5432"]
    volumes: [request_db_data:/var/lib/postgresql/data]
    healthcheck: *db-healthcheck

  offer-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: offer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5436:5432"]
    volumes: [offer_db_data:/var/lib/postgresql/data]
    healthcheck: *db-healthcheck

  admin-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: admin_contact_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5437:5432"]
    volumes: [admin_db_data:/var/lib/postgresql/data]
    healthcheck: *db-healthcheck

  notification-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5438:5432"]
    volumes: [notification_db_data:/var/lib/postgresql/data]
    healthcheck: *db-healthcheck

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      <<: *secrets
      DB_HOST: auth-db
      DB_NAME: user_auth_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      # seeds the ADMIN account; blank would skip seeding
      ADMIN_PASSWORD: admin-dev-password
    depends_on:
      auth-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  customer-service:
    build:
      context: .
      dockerfile: customer-service/Dockerfile
    environment:
      <<: *secrets
      DB_HOST: customer-db
      DB_NAME: customer_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      customer-db: {condition: service_healthy}
      auth-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  seller-service:
    build:
      context: .
      dockerfile: seller-service/Dockerfile
    environment:
      <<: *secrets
      DB_HOST: seller-db
      DB_NAME: seller_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      seller-db: {condition: service_healthy}
      auth-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # The first of two Go services. It reaches customer-service to turn the token's userId
  # into the customerId that participation records, so it waits for that to be healthy.
  request-service:
    build:
      context: .
      dockerfile: request-service/Dockerfile
    environment:
      <<: *secrets
      DB_HOST: request-db
      DB_NAME: request_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      CUSTOMER_SERVICE_URL: http://customer-service:8082
    depends_on:
      request-db: {condition: service_healthy}
      customer-service: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # The Python service. It resolves the token's userId to a sellerId through
  # seller-service and validates the target request through request-service.
  offer-service:
    build:
      context: .
      dockerfile: offer-service/Dockerfile
    environment:
      <<: *secrets
      DB_HOST: offer-db
      DB_NAME: offer_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      SELLER_SERVICE_URL: http://seller-service:8083
      REQUEST_SERVICE_URL: http://request-service:8084
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      offer-db: {condition: service_healthy}
      seller-service: {condition: service_healthy}
      request-service: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  # The second Go service, and the most connected one: deciding an offer touches
  # offer-service and request-service, and answering a seller's contact lookup walks
  # seller-service, customer-service and auth-service in turn. It waits on all of them.
  admin-service:
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    environment:
      <<: *secrets
      DB_HOST: admin-db
      DB_NAME: admin_contact_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      AUTH_SERVICE_URL: http://auth-service:8081
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      SELLER_SERVICE_URL: http://seller-service:8083
      REQUEST_SERVICE_URL: http://request-service:8084
      OFFER_SERVICE_URL: http://offer-service:8085
    depends_on:
      admin-db: {condition: service_healthy}
      auth-service: {condition: service_healthy}
      customer-service: {condition: service_healthy}
      seller-service: {condition: service_healthy}
      request-service: {condition: service_healthy}
      offer-service: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # The second Python service, and the only one in the platform with no outbound
  # dependency: producers hand it a userId and a rendered message, so it never has to
  # resolve an identity or read another service's data. It therefore waits on nothing
  # but its own database.
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      <<: *secrets
      DB_HOST: notification-db
      DB_NAME: notification_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      notification-db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

volumes:
  auth_db_data:
  customer_db_data:
  seller_db_data:
  request_db_data:
  offer_db_data:
  admin_db_data:
  notification_db_data:
  rabbitmq_data:

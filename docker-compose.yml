# Runs the whole system on one network. Services reach each other by service
# name, so no host.docker.internal is needed.
#
#   docker compose up --build
#
# JWT_SECRET and INTERNAL_API_KEY are shared by every service by construction:
# tokens are validated locally in each service, and the internal key is one
# shared secret. Dev values only.

x-secrets: &secrets
  JWT_SECRET: dev-secret-key-change-in-production-min-256-bits
  INTERNAL_API_KEY: dev-internal-api-key-change-in-production

x-db-healthcheck: &db-healthcheck
  test: ["CMD-SHELL", "pg_isready -U postgres"]
  interval: 5s
  timeout: 5s
  retries: 10

services:
  auth-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: user_auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [auth_db_data:/var/lib/postgresql/data]
    healthcheck: *db-healthcheck

  customer-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes: [customer_db_data:/var/lib/postgresql/data]
    healthcheck: *db-healthcheck

  seller-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: seller_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5434:5432"]
    volumes: [seller_db_data:/var/lib/postgresql/data]
    healthcheck: *db-healthcheck

  request-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: request_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5435:5432"]
    volumes: [request_db_data:/var/lib/postgresql/data]
    healthcheck: *db-healthcheck

  offer-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: offer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5436:5432"]
    volumes: [offer_db_data:/var/lib/postgresql/data]
    healthcheck: *db-healthcheck

  admin-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: admin_contact_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5437:5432"]
    volumes: [admin_db_data:/var/lib/postgresql/data]
    healthcheck: *db-healthcheck

  notification-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5438:5432"]
    volumes: [notification_db_data:/var/lib/postgresql/data]
    healthcheck: *db-healthcheck

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports: ["8081:8081"]
    environment:
      <<: *secrets
      DB_HOST: auth-db
      DB_NAME: user_auth_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      # seeds the ADMIN account; blank would skip seeding
      ADMIN_PASSWORD: admin-dev-password
    depends_on:
      auth-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  customer-service:
    build:
      context: .
      dockerfile: customer-service/Dockerfile
    ports: ["8082:8082"]
    environment:
      <<: *secrets
      DB_HOST: customer-db
      DB_NAME: customer_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      customer-db: {condition: service_healthy}
      auth-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  seller-service:
    build:
      context: .
      dockerfile: seller-service/Dockerfile
    ports: ["8083:8083"]
    environment:
      <<: *secrets
      DB_HOST: seller-db
      DB_NAME: seller_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      seller-db: {condition: service_healthy}
      auth-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # The first of two Go services. It reaches customer-service to turn the token's userId
  # into the customerId that participation records, so it waits for that to be healthy.
  request-service:
    build:
      context: .
      dockerfile: request-service/Dockerfile
    ports: ["8084:8084"]
    environment:
      <<: *secrets
      DB_HOST: request-db
      DB_NAME: request_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      CUSTOMER_SERVICE_URL: http://customer-service:8082
    depends_on:
      request-db: {condition: service_healthy}
      customer-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # The Python service. It resolves the token's userId to a sellerId through
  # seller-service and validates the target request through request-service.
  offer-service:
    build:
      context: .
      dockerfile: offer-service/Dockerfile
    ports: ["8085:8085"]
    environment:
      <<: *secrets
      DB_HOST: offer-db
      DB_NAME: offer_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      SELLER_SERVICE_URL: http://seller-service:8083
      REQUEST_SERVICE_URL: http://request-service:8084
    depends_on:
      offer-db: {condition: service_healthy}
      seller-service: {condition: service_healthy}
      request-service: {condition: service_healthy}

  # The second Go service, and the most connected one: deciding an offer touches
  # offer-service and request-service, and answering a seller's contact lookup walks
  # seller-service, customer-service and auth-service in turn. It waits on all of them.
  admin-service:
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    ports: ["8086:8086"]
    environment:
      <<: *secrets
      DB_HOST: admin-db
      DB_NAME: admin_contact_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      AUTH_SERVICE_URL: http://auth-service:8081
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      SELLER_SERVICE_URL: http://seller-service:8083
      REQUEST_SERVICE_URL: http://request-service:8084
      OFFER_SERVICE_URL: http://offer-service:8085
    depends_on:
      admin-db: {condition: service_healthy}
      auth-service: {condition: service_healthy}
      customer-service: {condition: service_healthy}
      seller-service: {condition: service_healthy}
      request-service: {condition: service_healthy}
      offer-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # The second Python service, and the only one in the platform with no outbound
  # dependency: producers hand it a userId and a rendered message, so it never has to
  # resolve an identity or read another service's data. It therefore waits on nothing
  # but its own database.
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports: ["8087:8087"]
    environment:
      <<: *secrets
      DB_HOST: notification-db
      DB_NAME: notification_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      notification-db: {condition: service_healthy}

volumes:
  auth_db_data:
  customer_db_data:
  seller_db_data:
  request_db_data:
  offer_db_data:
  admin_db_data:
  notification_db_data:

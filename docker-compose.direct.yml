# Republishes the service, database and broker ports that the default compose file
# deliberately withholds. With this overlay off, :8080 is the only port on the host.
#
#   docker compose -f docker-compose.yml -f docker-compose.direct.yml up
#
# Spec section 6 keeps /internal off the public gateway, so the Postman collection's 26
# /internal and 8 /actuator requests have no route through :8080 by design. They need a
# direct one. This is the compose equivalent of `kubectl port-forward`: an opt-in hole
# for testing and debugging, never the default, so forgetting to use it fails closed
# rather than leaving the internal API exposed.
#
# The 82 /api requests do not need this - they go through the gateway either way.
#
# The databases are here for the same reason. Nothing in the platform reaches a database
# from the host - services resolve each other by compose service name on the internal
# network - so a published 5432 only ever serves a psql client or a GUI. Withholding it
# by default also means seven Postgres containers cannot collide with a Postgres already
# running on the host, which is the usual reason `up` fails on a fresh machine.
#
# RabbitMQ is here for the same reason: the services reach the broker over the internal
# network, so 5672 on the host serves an external AMQP client, and 15672 the management
# console - both debugging tools rather than anything the platform needs.
services:
  auth-service:         {ports: ["8081:8081"]}
  customer-service:     {ports: ["8082:8082"]}
  seller-service:       {ports: ["8083:8083"]}
  request-service:      {ports: ["8084:8084"]}
  offer-service:        {ports: ["8085:8085"]}
  admin-service:        {ports: ["8086:8086"]}
  notification-service: {ports: ["8087:8087"]}

  auth-db:              {ports: ["5432:5432"]}
  customer-db:          {ports: ["5433:5432"]}
  seller-db:            {ports: ["5434:5432"]}
  request-db:           {ports: ["5435:5432"]}
  offer-db:             {ports: ["5436:5432"]}
  admin-db:             {ports: ["5437:5432"]}
  notification-db:      {ports: ["5438:5432"]}

  rabbitmq:             {ports: ["5672:5672", "15672:15672"]}

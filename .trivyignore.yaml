# Findings that were already here when Trivy was switched on, and nothing else.
#
# Every entry carries an expiry. On 2026-12-01 they stop being ignored and the
# security job goes red on its own - which is the point: this file is a dated
# record of known debt, not a way to stop hearing about it. A CVE that is not
# listed here has never been triaged and fails the build the first time it appears.
#
# Baselined 2026-09-03 against Trivy 0.74.0.

vulnerabilities:
  # --- Spring Boot 3.2.5 (April 2024) --------------------------------------
  #
  # The root pom pins spring-boot-starter-parent 3.2.5, and every one of the
  # 39 entries below is a transitive consequence of that single version. They
  # are not 39 separate decisions to make; they are one upgrade to 3.5.x,
  # after which this whole block is deleted rather than renewed.
  #
  # 23 of them are the embedded Tomcat alone, which Spring Boot manages -
  # bumping the parent moves it without a dependency declaration of our own.


  # --- Go: test-only, and not in anything that ships ------------------------
  #
  # Both are `// indirect` in request-service and admin-service, pulled in by
  # Testcontainers' Docker client - which the suites use and the binaries do not.
  # Confirmed rather than assumed: `trivy image` on the two Go images reports
  # 0 HIGH and 0 CRITICAL, because neither package is linked into the binary.
  # They are listed here so the go.mod scan stays on for everything else.
  - id: CVE-2026-17106
    statement: "HIGH in github.com/moby/go-archive; indirect, Testcontainers-only, absent from the shipped image."
    expired_at: 2026-12-01
  - id: CVE-2026-56854
    statement: "CRITICAL in golang.org/x/crypto; indirect, Testcontainers-only, absent from the shipped image."
    expired_at: 2026-12-01

  # --- Base image: nginx:1.27-alpine ----------------------------------------
  #
  # Not ours to patch in a Dockerfile: the tag itself resolves to alpine 3.21.3,
  # and a fresh pull today still carries it. nginx:1.29-alpine drops the image
  # from 35 HIGH / 2 CRITICAL to 15 HIGH / 0 CRITICAL - the fix is to move the
  # pin, in both frontend/Dockerfile and the gateway service in docker-compose.yml.
  - id: CVE-2026-31789
    statement: "CRITICAL in libcrypto3/libssl3 from nginx:1.27-alpine; fixed by moving the pin to nginx:1.29-alpine."
    expired_at: 2026-12-01

misconfigurations:
  # The frontend image is the one of the eight that does not drop privileges,
  # because the stock nginx entrypoint needs root to bind :80 and to write its
  # pid and cache. Moving it to a non-root user means an unprivileged nginx on a
  # high port, which changes the gateway upstream and the compose healthcheck
  # with it - a real change, not a one-line Dockerfile edit, so it is dated here
  # rather than done quietly.
  - id: DS-0002
    paths:
      - "frontend/Dockerfile"
    statement: "nginx runs as root; needs an unprivileged image and a port change, not a USER line."
    expired_at: 2026-12-01

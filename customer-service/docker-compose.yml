version: "3.9"

services:
  customer-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - customer_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  customer-service:
    build: .
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - DB_HOST=customer-db
      - DB_PORT=5432
      - DB_NAME=customer_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - AUTH_SERVICE_URL=http://host.docker.internal:8081
    depends_on:
      customer-db:
        condition: service_healthy

volumes:
  customer_db_data:

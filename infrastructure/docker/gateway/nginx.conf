# The public edge, and the whole of the platform's routing table.
#
# Spec section 19 lists nine public routes; the map below is them. Spec section 6 adds
# the rule that makes the shape matter - "Endpoints starting with /internal must not be
# exposed by the public API Gateway" - and it is enforced by default-deny: a path that
# is not in the table maps to the empty string and is refused, so /internal and
# /actuator have no route at all rather than being excluded by a rule someone has to
# remember to keep in step.
#
# This file is the routing table, not a copy of it. The Kubernetes Ingress that replaces
# it expresses the same nine prefixes: `pathType: Prefix` on /api/requests matches
# /api/requests and /api/requests/... but not /api/requestsfoo, which is exactly what the
# (/|$) boundary means here. Four endpoints are the bare prefix itself - POST
# /api/requests, /api/offers, /api/customers, /api/sellers - so a trailing-slash match
# would silently 404 them.

worker_processes auto;

events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server_tokens off;
    client_max_body_size 1m;

    # No static files are served, so every `return` body below is JSON.
    default_type application/json;

    # Docker's embedded DNS. Upstreams resolve per request through a variable rather
    # than once at startup, because nginx caches a literal proxy_pass hostname for the
    # life of the process - a service that restarts with a new IP would keep receiving
    # traffic at the old one. It also lets the edge start when a service is not up yet,
    # instead of failing to load its own config.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- Spec section 19: the nine public routes --------------------------------------
    map $uri $upstream {
        default                    "";
        ~^/api/auth(/|$)           http://auth-service:8081;
        ~^/api/users(/|$)          http://auth-service:8081;
        ~^/api/customers(/|$)      http://customer-service:8082;
        ~^/api/sellers(/|$)        http://seller-service:8083;
        ~^/api/requests(/|$)       http://request-service:8084;
        ~^/api/offers(/|$)         http://offer-service:8085;
        ~^/api/admin(/|$)          http://admin-service:8086;
        ~^/api/contacts(/|$)       http://admin-service:8086;
        ~^/api/notifications(/|$)  http://notification-service:8087;
    }
    # ----------------------------------------------------------------------------------

    # Browser origins allowed to call the API - development servers only; a deployment
    # adds its own. The origin is echoed back rather than answered with `*` because an
    # allowlist is the part that changes per environment, and because `*` stops working
    # the moment a request carries credentials. An unlisted origin yields the empty
    # string, which omits the header entirely and lets the browser refuse the response -
    # the request is not served differently, it is simply not readable by the page.
    map $http_origin $cors_origin {
        default                                       "";
        ~^http://localhost:(3000|4200|5173)$          $http_origin;
        ~^http://127\.0\.0\.1:(3000|4200|5173)$       $http_origin;
    }

    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_read_timeout   30s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Cleared, not forwarded. Identity is taken from the JWT's sub claim by each service
    # and never from a header, so a client must not be able to smuggle either of these in
    # from outside: the internal key is the only thing standing in front of /internal,
    # and X-User-Id is the header every service was explicitly taught to stop trusting.
    proxy_set_header X-Internal-Api-Key "";
    proxy_set_header X-User-Id          "";

    server {
        listen 8080;

        # `always`, so the headers survive the 401s and 403s the negative-case flows rely
        # on - without it a browser cannot read the error body of a rejected request and
        # reports an opaque CORS failure instead of the real status.
        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        # Authorization and Content-Type only. X-Internal-Api-Key is deliberately absent:
        # the internal key is not a browser credential, and advertising it here would
        # invite a frontend to send one.
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Max-Age       600 always;
        # The response varies by request origin, so a cache must not serve one origin's
        # copy to another.
        add_header Vary Origin always;

        # The edge's own liveness, answered without touching a service.
        location = /health { return 200 '{"status":"UP"}'; }

        location / {
            # Default-deny comes first, so an unroutable path is still 404 - a preflight
            # to /internal must not be answered any differently from a GET to it.
            if ($upstream = "") {
                return 404 '{"message":"Not Found","status":404}';
            }

            # Preflight is answered here rather than proxied. It never carries the
            # Authorization header, so any service that authenticates it would reject it
            # before the real request was ever sent.
            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass $upstream$request_uri;
        }
    }
}

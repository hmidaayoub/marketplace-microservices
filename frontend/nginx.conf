# Serves the built single-page app. Nothing else: the API, the specs and the docs are
# the gateway's, and this container never learns their addresses - the browser asks one
# origin and the edge decides what answers.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressed on the way out. The bundle is the one large thing this serves, and it
    # is text.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints every asset it emits - the content is in the name - so a file
    # under /assets can never change meaning and is cached for as long as a browser will
    # keep it.
    location /assets/ {
        # One header, not `expires` as well: that directive emits a Cache-Control of its
        # own, and a response carrying the directive twice says the same thing in two
        # places that can later disagree.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The opposite rule for the document that names those assets. Cached, it would keep
    # pointing at the bundle of the previous deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # /requests/<id> is a route inside the bundle, not a file on disk. Anything that is
    # not a real file is the app's own routing to resolve, which is what makes a deep
    # link work on a hard refresh rather than only on a click.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
